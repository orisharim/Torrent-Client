services:
  torrent-client:
    build: .
    container_name: torrent-client
    environment:
      - DISPLAY=${DISPLAY}
      - QT_X11_NO_MITSHM=1
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./:/workspace
    working_dir: /workspace
    network_mode: host
    stdin_open: true
    tty: true